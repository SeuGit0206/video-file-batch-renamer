name: "Automated Release"

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Build Application
        run: npm run build

      - name: Prepare Windows Distribution Package
        run: |
          mkdir -p release-dist
          cp -r dist release-dist/
          cp package.json release-dist/
          cp package-lock.json release-dist/
          cp .env.example release-dist/
          cp README.md release-dist/
          cp CHANGELOG.md release-dist/
          cp -r docs release-dist/
          zip -r video-renamer-tool-${{ github.ref_name }}-windows.zip release-dist
          sha256sum video-renamer-tool-${{ github.ref_name }}-windows.zip > video-renamer-tool-${{ github.ref_name }}-windows.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            video-renamer-tool-${{ github.ref_name }}-windows.zip
            video-renamer-tool-${{ github.ref_name }}-windows.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

